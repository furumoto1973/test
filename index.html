<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>名刺キャプチャ — MW Phase 1 POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1018;
    --bg-elev: #131a25;
    --bg-elev2: #1a2230;
    --line: #2a3445;
    --line-strong: #3d4a5f;
    --text: #e6ebf2;
    --text-dim: #8a96a8;
    --text-faint: #5a6678;
    --accent: #d4a854;
    --accent-dim: #8c6f3a;
    --danger: #e0594a;
    --ok: #6fbf73;
    --info: #5c9fde;
    --sans: "Noto Sans JP", system-ui, -apple-system, sans-serif;
    --serif: "Noto Serif JP", serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  body { display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bot); }

  /* ───── Top bar ───── */
  header {
    flex: 0 0 auto;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
    display: flex; align-items: center; justify-content: space-between;
  }
  header .brand { display: flex; align-items: baseline; gap: 8px; }
  header .brand .logo { font-family: var(--serif); font-size: 16px; letter-spacing: 0.04em; color: var(--accent); }
  header .brand .sub { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; }
  header .session { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  header .session .count { color: var(--accent); font-weight: 500; }

  /* ───── View switcher ───── */
  .tabs {
    flex: 0 0 auto;
    display: flex; gap: 0;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    flex: 1; padding: 10px 8px;
    background: transparent; border: none;
    color: var(--text-dim);
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    border-bottom: 2px solid transparent;
    cursor: pointer; transition: all 0.15s;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; }
  .view.active { display: flex; }

  /* ───── Capture view ───── */
  #view-capture { background: #000; }
  .video-wrap { flex: 1; position: relative; overflow: hidden; background: #000; }
  #cam { width: 100%; height: 100%; object-fit: cover; }
  #detect-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .overlay-hud {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    pointer-events: none;
  }
  .hud-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px;
  }
  .hud-chip {
    background: rgba(11,16,24,0.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(212,168,84,0.3);
    padding: 6px 10px; border-radius: 3px;
    font-family: var(--mono); font-size: 10px;
    color: var(--text); letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 6px;
  }
  .hud-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .hud-chip.live .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.6s infinite; }
  .hud-chip.detect .dot { background: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }

  .hud-bottom {
    padding: 16px;
    background: linear-gradient(to top, rgba(11,16,24,0.85), transparent);
    pointer-events: auto;
  }
  .telemetry {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 1px; margin-bottom: 16px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .tele-cell {
    background: rgba(11,16,24,0.7); padding: 8px 10px;
    font-family: var(--mono); font-size: 10px;
  }
  .tele-label { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; font-size: 9px; }
  .tele-value { color: var(--text); font-size: 13px; font-weight: 500; margin-top: 2px; }
  .tele-value.good { color: var(--ok); }
  .tele-value.bad { color: var(--danger); }

  .controls-row { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .btn-shutter {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); border: 4px solid #fff;
    box-shadow: 0 0 0 2px var(--accent);
    cursor: pointer; transition: transform 0.1s;
  }
  .btn-shutter:active { transform: scale(0.9); }
  .btn-shutter:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: rgba(26,34,48,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    color: var(--text); padding: 10px 14px; border-radius: 3px;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; min-height: 44px;
  }
  .btn-secondary.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* Card frame guide */
  .card-guide {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 86%; aspect-ratio: 91 / 55;
    border: 2px dashed rgba(212,168,84,0.6);
    border-radius: 4px;
    pointer-events: none;
  }
  .card-guide.locked { border-style: solid; border-color: var(--ok); box-shadow: 0 0 24px rgba(111,191,115,0.4); }
  .card-guide::before, .card-guide::after,
  .card-guide > .corner {
    content: ''; position: absolute; width: 24px; height: 24px;
    border-color: var(--accent); border-style: solid; border-width: 0;
  }
  .card-guide::before { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; }
  .card-guide::after { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; }
  .card-guide .c-bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; }
  .card-guide .c-br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; }

  /* ───── Review view ───── */
  #view-review { background: var(--bg); overflow-y: auto; }
  .review-img-wrap {
    background: #000; max-height: 38vh; display: flex; align-items: center; justify-content: center;
    overflow: hidden; border-bottom: 1px solid var(--line);
  }
  .review-img-wrap img { max-width: 100%; max-height: 38vh; display: block; }
  .review-status {
    padding: 10px 16px; background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--text-faint); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  .fields { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .field-group {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
  }
  .field-label {
    font-family: var(--mono); font-size: 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px;
  }
  .field-input {
    width: 100%; background: transparent; border: none;
    color: var(--text); font-family: var(--sans); font-size: 15px;
    padding: 2px 0; outline: none;
  }
  .field-input.mono { font-family: var(--mono); font-size: 14px; }
  .field-input::placeholder { color: var(--text-faint); }
  .field-input:focus { color: var(--accent); }
  textarea.field-input { resize: vertical; min-height: 60px; font-size: 13px; }

  .security-row {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 3px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sec-title { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .sec-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .sec-pill {
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--text-dim); font-size: 12px; cursor: pointer;
    font-family: var(--sans);
  }
  .sec-pill.active.normal { background: var(--info); border-color: var(--info); color: #fff; }
  .sec-pill.active.confidential { background: var(--danger); border-color: var(--danger); color: #fff; }

  .review-actions {
    position: sticky; bottom: 0;
    padding: 12px 16px; background: var(--bg-elev); border-top: 1px solid var(--line);
    display: flex; gap: 10px;
  }
  .btn-primary {
    flex: 1; padding: 14px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 3px; font-family: var(--sans); font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-ghost {
    padding: 14px 18px; background: transparent; color: var(--text-dim);
    border: 1px solid var(--line-strong); border-radius: 3px;
    font-family: var(--sans); font-size: 14px; cursor: pointer;
  }

  /* ───── List view ───── */
  #view-list { background: var(--bg); overflow-y: auto; }
  .list-header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; background: var(--bg-elev); }
  .list-header h2 { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .list-header .actions { display: flex; gap: 8px; }
  .list-header button {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    padding: 6px 10px; border-radius: 3px; font-size: 11px; font-family: var(--mono); cursor: pointer;
  }
  .card-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .card-item {
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 3px;
    padding: 12px; display: flex; gap: 12px; cursor: pointer;
  }
  .card-item.confidential { border-left: 3px solid var(--danger); }
  .card-item.normal { border-left: 3px solid var(--info); }
  .card-thumb { width: 64px; height: 40px; background: #000; border-radius: 2px; flex-shrink: 0; object-fit: cover; }
  .card-meta { flex: 1; min-width: 0; }
  .card-meta .name { font-size: 15px; font-weight: 700; }
  .card-meta .company { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .card-meta .title-line { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 4px; }
  .card-meta .sec-flag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 2px; font-size: 9px; vertical-align: middle; }
  .card-meta .sec-flag.confidential { background: var(--danger); color: #fff; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-faint); }
  .empty-state .icon { font-size: 32px; opacity: 0.4; margin-bottom: 8px; }

  /* ───── Modal / toast ───── */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elev2); border: 1px solid var(--line-strong);
    padding: 10px 16px; border-radius: 3px;
    font-family: var(--mono); font-size: 12px;
    z-index: 1000; max-width: 90vw;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--ok); color: var(--ok); }

  /* Permission gate */
  .gate {
    position: absolute; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; z-index: 10;
  }
  .gate.hidden { display: none; }
  .gate h1 { font-family: var(--serif); font-size: 22px; margin-bottom: 8px; }
  .gate p { color: var(--text-dim); max-width: 320px; margin-bottom: 20px; font-size: 13px; }
  .gate button { background: var(--accent); color: var(--bg); border: none; padding: 14px 28px; border-radius: 3px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .gate .note { margin-top: 24px; font-family: var(--mono); font-size: 10px; color: var(--text-faint); max-width: 320px; text-align: left; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">MetroWeather</span>
    <span class="sub">名刺 · Phase 1</span>
  </div>
  <div class="session">SESSION <span class="count" id="count">0</span></div>
</header>

<nav class="tabs">
  <button data-view="capture" class="active">撮影</button>
  <button data-view="review" id="tab-review" disabled>確認</button>
  <button data-view="list">一覧</button>
</nav>

<main>
  <!-- CAPTURE VIEW -->
  <section id="view-capture" class="view active">
    <div class="gate" id="gate">
      <h1>名刺キャプチャ</h1>
      <p>背面カメラへのアクセスを許可してください。名刺を枠内に収めると自動的に撮影されます。</p>
      <button id="gate-btn">カメラを開始</button>
      <div class="note">
        iPhone Safariで開いてください。インカメラしか起動しない場合はSafariの設定 → カメラから許可を確認。
      </div>
    </div>

    <div class="video-wrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="detect-canvas"></canvas>
      <div class="card-guide" id="guide">
        <span class="corner c-bl"></span><span class="corner c-br"></span>
      </div>
      <div class="overlay-hud">
        <div class="hud-top">
          <div class="hud-chip live" id="chip-live"><span class="dot"></span><span id="chip-live-text">LIVE</span></div>
          <div class="hud-chip detect" id="chip-detect"><span class="dot"></span><span id="chip-detect-text">準備中</span></div>
        </div>
        <div class="hud-bottom">
          <div class="telemetry">
            <div class="tele-cell"><div class="tele-label">焦点</div><div class="tele-value" id="m-focus">—</div></div>
            <div class="tele-cell"><div class="tele-label">静止</div><div class="tele-value" id="m-stable">—</div></div>
            <div class="tele-cell"><div class="tele-label">明度</div><div class="tele-value" id="m-bright">—</div></div>
          </div>
          <div class="controls-row">
            <button class="btn-secondary" id="btn-switch">⇄</button>
            <button class="btn-shutter" id="btn-shutter" aria-label="撮影"></button>
            <button class="btn-secondary on" id="btn-auto">AUTO</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- REVIEW VIEW -->
  <section id="view-review" class="view">
    <div class="review-img-wrap">
      <img id="review-img" alt="">
    </div>
    <div class="review-status" id="review-status">
      <div class="spinner"></div>
      <span>Claude Vision で解析中...</span>
    </div>
    <div class="fields" id="fields-container">
      <!-- generated dynamically -->
    </div>
    <div class="review-actions">
      <button class="btn-ghost" id="btn-retake">撮り直し</button>
      <button class="btn-primary" id="btn-save">保存</button>
    </div>
  </section>

  <!-- LIST VIEW -->
  <section id="view-list" class="view">
    <div class="list-header">
      <h2>収集済み名刺</h2>
      <div class="actions">
        <button id="btn-export">JSON出力</button>
        <button id="btn-clear">クリア</button>
      </div>
    </div>
    <div class="card-list" id="card-list"></div>
  </section>
</main>

<script>
// ═════════════════════════════════════════════════════════════════
//   MetroWeather 名刺キャプチャ — Phase 1 POC
//   動画 → カード検出 → Claude Vision OCR → 構造化保存
// ═════════════════════════════════════════════════════════════════

const State = {
  cards: [],             // {id, image, fields, security, ts}
  current: null,         // 撮影直後の作業中レコード
  stream: null,
  facingMode: 'environment',
  autoCapture: true,
  ocrInflight: false,
  stableFrames: 0,
  STABLE_THRESHOLD: 12,  // frames (~1秒 @ 12fps detect loop)
  lastCaptureTs: 0,
  COOLDOWN_MS: 2000,
};

const FIELDS = [
  { key: 'company',      label: '社名',           mono: false },
  { key: 'department',   label: '部署',           mono: false },
  { key: 'title',        label: '役職',           mono: false },
  { key: 'name',         label: '氏名',           mono: false },
  { key: 'name_reading', label: 'ふりがな / Roman',mono: false },
  { key: 'email',        label: 'Email',          mono: true  },
  { key: 'phone',        label: 'TEL (固定)',     mono: true  },
  { key: 'mobile',       label: 'TEL (携帯)',     mono: true  },
  { key: 'fax',          label: 'FAX',            mono: true  },
  { key: 'postal_code',  label: '〒',             mono: true  },
  { key: 'address',      label: '住所',           mono: false, multiline: true },
  { key: 'website',      label: 'Website',        mono: true  },
  { key: 'other',        label: 'その他メモ',     mono: false, multiline: true },
];

// ─── DOM ───
const $ = (id) => document.getElementById(id);
const video = $('cam');
const detectCanvas = $('detect-canvas');
const dctx = detectCanvas.getContext('2d', { willReadFrequently: true });

// ─── Toast ───
function toast(msg, kind='') {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ─── Camera ───
async function startCamera() {
  try {
    if (State.stream) State.stream.getTracks().forEach(t => t.stop());
    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: State.facingMode },
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
      }
    };
    State.stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = State.stream;
    await video.play();
    $('gate').classList.add('hidden');
    startDetectLoop();
  } catch (e) {
    console.error(e);
    toast('カメラ起動エラー: ' + e.message, 'error');
  }
}

$('gate-btn').addEventListener('click', startCamera);
$('btn-switch').addEventListener('click', async () => {
  State.facingMode = State.facingMode === 'environment' ? 'user' : 'environment';
  await startCamera();
});

// ─── Detect loop: focus / stability / brightness ───
let prevSampleData = null;
let detectRAF = null;

function startDetectLoop() {
  cancelAnimationFrame(detectRAF);
  let lastTick = 0;
  const TICK_MS = 80; // ~12 fps for detection

  function loop(ts) {
    if (ts - lastTick > TICK_MS) {
      lastTick = ts;
      try { measureFrame(); } catch(e){ /* ignore transient */ }
    }
    detectRAF = requestAnimationFrame(loop);
  }
  detectRAF = requestAnimationFrame(loop);
}

function measureFrame() {
  if (!video.videoWidth) return;

  const W = 200, H = 120;
  detectCanvas.width = W; detectCanvas.height = H;

  // Sample card-frame region of the video
  const vW = video.videoWidth, vH = video.videoHeight;
  const srcW = vW * 0.86;
  const srcH = srcW * (55/91);
  const sx = (vW - srcW) / 2;
  const sy = (vH - srcH) / 2;

  dctx.drawImage(video, sx, sy, srcW, srcH, 0, 0, W, H);
  const imgData = dctx.getImageData(0, 0, W, H);
  const data = imgData.data;

  // Compute brightness (mean luma) + Laplacian variance (focus proxy)
  let sum = 0, lumas = new Float32Array(W * H);
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const l = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    lumas[j] = l; sum += l;
  }
  const meanLuma = sum / (W*H);

  let lapSum = 0, lapSumSq = 0, lapN = 0;
  for (let y = 1; y < H-1; y++) {
    for (let x = 1; x < W-1; x++) {
      const idx = y*W + x;
      const lap = 4*lumas[idx] - lumas[idx-1] - lumas[idx+1] - lumas[idx-W] - lumas[idx+W];
      lapSum += lap; lapSumSq += lap*lap; lapN++;
    }
  }
  const lapMean = lapSum / lapN;
  const lapVar = lapSumSq / lapN - lapMean*lapMean;

  // Stability via downsampled diff
  let diffSum = 0;
  if (prevSampleData) {
    const step = 4 * 8; // every 8th pixel
    for (let i = 0; i < data.length; i += step) {
      diffSum += Math.abs(data[i] - prevSampleData[i]);
    }
  }
  prevSampleData = new Uint8ClampedArray(data);
  const diffNorm = diffSum / (W*H/8);

  // Update HUD
  const focusGood = lapVar > 80;
  const stableGood = diffNorm < 3.0;
  const brightGood = meanLuma > 60 && meanLuma < 220;

  $('m-focus').textContent  = lapVar.toFixed(0);
  $('m-focus').className    = 'tele-value ' + (focusGood ? 'good' : 'bad');
  $('m-stable').textContent = diffNorm.toFixed(2);
  $('m-stable').className   = 'tele-value ' + (stableGood ? 'good' : 'bad');
  $('m-bright').textContent = meanLuma.toFixed(0);
  $('m-bright').className   = 'tele-value ' + (brightGood ? 'good' : 'bad');

  const allGood = focusGood && stableGood && brightGood;
  $('guide').classList.toggle('locked', allGood);
  $('chip-detect-text').textContent = allGood ? 'LOCKED' : '位置調整';

  if (allGood) {
    State.stableFrames++;
  } else {
    State.stableFrames = 0;
  }

  if (State.autoCapture
      && State.stableFrames >= State.STABLE_THRESHOLD
      && !State.ocrInflight
      && (Date.now() - State.lastCaptureTs) > State.COOLDOWN_MS) {
    State.lastCaptureTs = Date.now();
    State.stableFrames = 0;
    capture();
  }
}

// ─── Capture ───
function capture() {
  const vW = video.videoWidth, vH = video.videoHeight;
  // Crop to card-frame region (86% width, 91:55 aspect)
  const srcW = vW * 0.86;
  const srcH = srcW * (55/91);
  const sx = (vW - srcW) / 2;
  const sy = (vH - srcH) / 2;

  const c = document.createElement('canvas');
  c.width = 1280; c.height = Math.round(1280 * 55/91);
  const ctx = c.getContext('2d');
  ctx.drawImage(video, sx, sy, srcW, srcH, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.85);

  State.current = {
    id: 'mw_' + Date.now(),
    image: dataUrl,
    fields: Object.fromEntries(FIELDS.map(f => [f.key, ''])),
    security: 'normal',
    ts: new Date().toISOString(),
  };

  switchView('review');
  $('review-img').src = dataUrl;
  renderFields(true);
  runOCR(dataUrl);
}

$('btn-shutter').addEventListener('click', () => {
  if (!State.stream) { toast('まずカメラを開始してください', 'error'); return; }
  capture();
});

$('btn-auto').addEventListener('click', () => {
  State.autoCapture = !State.autoCapture;
  $('btn-auto').classList.toggle('on', State.autoCapture);
  $('btn-auto').textContent = State.autoCapture ? 'AUTO' : 'MANUAL';
});

// ─── OCR via Claude API ───
const OCR_PROMPT = `あなたは日本の名刺OCRエキスパートです。提供された名刺画像から以下のフィールドを抽出し、JSON のみで返答してください。コードフェンス（\`\`\`）や前置きは不要です。

抽出フィールド（キーは英語、値は名刺記載のとおり）:
- company: 会社名（株式会社などの法人格を含む正式名称）
- department: 部署名
- title: 役職
- name: 氏名（漢字）
- name_reading: ふりがな または ローマ字
- email: メールアドレス（複数あれば配列）
- phone: 固定電話番号（ハイフン付き 例: 03-1234-5678）
- mobile: 携帯電話番号
- fax: FAX番号
- postal_code: 郵便番号（例: 600-8086）
- address: 住所
- website: ウェブサイトURL
- other: 上記に該当しない情報（QRコード、SNS、スローガン等）

ルール:
- 読み取れない / 記載がない項目は null
- 日本語・英語両面記載の名刺は統合して抽出
- 必ず有効な JSON のみを返す`;

async function runOCR(dataUrl) {
  State.ocrInflight = true;
  $('review-status').innerHTML = '<div class="spinner"></div><span>Claude Vision で解析中...</span>';

  const base64 = dataUrl.split(',')[1];
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
            { type: 'text',  text: OCR_PROMPT },
          ],
        }],
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const text = json.content.filter(b => b.type==='text').map(b => b.text).join('').trim();
    const cleaned = text.replace(/^```json\s*/i,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(cleaned);

    // Merge into State.current.fields
    for (const f of FIELDS) {
      let v = parsed[f.key];
      if (Array.isArray(v)) v = v.join(', ');
      if (v == null) v = '';
      State.current.fields[f.key] = String(v);
    }
    renderFields(false);
    $('review-status').innerHTML = `<span style="color:var(--ok)">✓ 解析完了 — 確認・編集して保存してください</span>`;
  } catch (e) {
    console.error(e);
    $('review-status').innerHTML = `<span style="color:var(--danger)">✗ OCR失敗: ${e.message} — 手動入力してください</span>`;
  } finally {
    State.ocrInflight = false;
  }
}

// ─── Field rendering ───
function renderFields(blank) {
  const container = $('fields-container');
  container.innerHTML = '';

  for (const f of FIELDS) {
    const wrap = document.createElement('div');
    wrap.className = 'field-group';

    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = f.label;

    let input;
    if (f.multiline) {
      input = document.createElement('textarea');
    } else {
      input = document.createElement('input');
      input.type = 'text';
    }
    input.className = 'field-input' + (f.mono ? ' mono' : '');
    input.value = blank ? '' : (State.current.fields[f.key] || '');
    input.placeholder = '—';
    input.addEventListener('input', () => {
      State.current.fields[f.key] = input.value;
    });

    wrap.appendChild(label);
    wrap.appendChild(input);
    container.appendChild(wrap);
  }

  // Security row
  const sec = document.createElement('div');
  sec.className = 'security-row';
  sec.innerHTML = `
    <div class="sec-title">アクセス区分</div>
    <div class="sec-options">
      <button class="sec-pill ${State.current.security==='normal'?'active normal':''}" data-sec="normal">通常 (フォルダ共有)</button>
      <button class="sec-pill ${State.current.security==='confidential'?'active confidential':''}" data-sec="confidential">機密 (個別指定)</button>
    </div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-top:4px">
      機密区分は社長室名刺など、閲覧者を個別に指定する名刺に使用します（Phase 2 で閲覧者選択UIを実装）。
    </div>
  `;
  sec.querySelectorAll('.sec-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      State.current.security = btn.dataset.sec;
      renderFields(false);
    });
  });
  container.appendChild(sec);
}

// ─── Save & list ───
$('btn-save').addEventListener('click', () => {
  if (!State.current) return;
  State.cards.unshift(State.current);
  State.current = null;
  $('count').textContent = State.cards.length;
  renderList();
  toast('保存しました', 'ok');
  switchView('capture');
});

$('btn-retake').addEventListener('click', () => {
  State.current = null;
  switchView('capture');
});

function renderList() {
  const list = $('card-list');
  if (State.cards.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">○</div>まだ名刺がありません</div>`;
    return;
  }
  list.innerHTML = '';
  for (const card of State.cards) {
    const div = document.createElement('div');
    div.className = 'card-item ' + (card.security || 'normal');
    const f = card.fields;
    div.innerHTML = `
      <img class="card-thumb" src="${card.image}" alt="">
      <div class="card-meta">
        <div class="name">${escapeHtml(f.name || '（氏名なし）')}${card.security==='confidential' ? '<span class="sec-flag confidential">機密</span>' : ''}</div>
        <div class="company">${escapeHtml(f.company || '')} ${f.title ? '· '+escapeHtml(f.title) : ''}</div>
        <div class="title-line">${escapeHtml(f.email || f.phone || f.mobile || '')}</div>
      </div>
    `;
    div.addEventListener('click', () => {
      State.current = JSON.parse(JSON.stringify(card));
      // Remove the existing instance — we will re-save on save
      State.cards = State.cards.filter(c => c.id !== card.id);
      $('count').textContent = State.cards.length;
      switchView('review');
      $('review-img').src = card.image;
      $('review-status').innerHTML = `<span>編集モード</span>`;
      renderFields(false);
    });
    list.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('btn-export').addEventListener('click', () => {
  if (State.cards.length === 0) { toast('出力するデータがありません', 'error'); return; }
  // Strip images from the export for readability; keep separately
  const out = State.cards.map(c => ({
    id: c.id, ts: c.ts, security: c.security, fields: c.fields,
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mw_meishi_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`${out.length}件をJSONで出力`, 'ok');
});

$('btn-clear').addEventListener('click', () => {
  if (!confirm(`${State.cards.length}件の名刺を全て削除します。よろしいですか？`)) return;
  State.cards = [];
  $('count').textContent = 0;
  renderList();
});

// ─── View switcher ───
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $('tab-review').disabled = !State.current && name !== 'review';
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    if (btn.dataset.view === 'review' && !State.current) return;
    switchView(btn.dataset.view);
    if (btn.dataset.view === 'list') renderList();
  });
});

// Initial render
renderList();
</script>
